<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
}

.navbar {
  overflow: hidden;
  background-color: #333;
}

.navbar a {
  float: left;
  font-size: 16px;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

.dropdown {
  float: left;
  overflow: hidden;
}

.dropdown .dropbtn {
  font-size: 16px;  
  border: none;
  outline: none;
  color: white;
  padding: 14px 16px;
  background-color: inherit;
  font-family: inherit;
  margin: 0;
}

.navbar a:hover, .dropdown:hover .dropbtn {
  background-color: red;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #333;
  min-width: 160px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}

.dropdown-content a {
  float: none;
  color: white;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
  text-align: left;
}

.dropdown-content a:hover {
  background-color: red;
}

.dropdown:hover .dropdown-content {
  display: block;
}
</style>
</head>
<body style="background-color:white;">

<div class="navbar">
  <a href="https://students.kas.mysisi.app/" target="_blank">SISI</a>
  <a href="https://globalonlineacademy.instructure.com/?login_success=1" target="_blank">GOA Dashboard</a>
  <div class="dropdown">
    <button class="dropbtn">Kas Quick Links
      <i class="fa fa-caret-down"></i>
    </button>
    <div class="dropdown-content">
      <a href="https://launchpad.classlink.com/kas" target="_blank">kas launchboard</a>
      <a href="https://students.kas.mysisi.app/" target="_blank">sisi</a>
      <a href="https://print.kas.tw/user" target="_blank">print management</a>
      <a href="https://sites.google.com/a/kas.kh.edu.tw/dgs/?pli=1&authuser=0" target="_blank">Dragon Gate family</a>
      <a href="https://ssp.kas.tw/" target="_blank">reset passwod</a>
      <a href="https://share.kas.tw/" target="_blank">student blogs</a>
    </div>
  </div>
</div>

<h3>Dropdown Menu inside a Navigation Bar</h3>
<p>Hover over the "Dropdown" link to see the dropdown menu.</p>

</body>
</html>
